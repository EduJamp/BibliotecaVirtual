<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://xmlns.jcp.org/jsf/passthrough">
<h:head>
    <title>Buscador de Libros</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</h:head>
<h:body class="bg-light">
    <div class="container mt-5">
        <h1 class="text-center mb-4 text-primary fw-bold">Biblioteca Virtual</h1>

        <!-- SECCIÓN DE BÚSQUEDA Y FILTROS -->
        <h:form id="searchForm" class="mb-5 shadow-sm p-4 bg-white rounded">
            <div class="row justify-content-center">
                <div class="col-md-10">
                    <div class="input-group input-group-lg">

                        <!-- Filtro por Título, Autor o Categoría -->
                        <h:selectOneMenu value="#{LibroBean.tipoBusqueda}" class="form-select bg-light" style="max-width: 200px;">
                            <f:selectItem itemLabel="Por Título" itemValue="titulo" />
                            <f:selectItem itemLabel="Por Autor" itemValue="autor" />
                            <f:selectItem itemLabel="Por Categoría" itemValue="categoria" />
                        </h:selectOneMenu>

                        <!-- Caja de Texto -->
                        <h:inputText value="#{LibroBean.terminoBusqueda}" class="form-control"
                                     p:placeholder="Ej. Harry Potter, Gabriel García..." />

                        <!-- Botón Buscar -->
                        <h:commandButton value="Buscar Libros" action="#{LibroBean.ejecutarBusqueda}"
                                         class="btn btn-primary px-4 fw-bold" />
                    </div>
                </div>
            </div>
        </h:form>

        <!-- SECCIÓN DE RESULTADOS -->
        <h:form id="booksForm">
            <div class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-4 mb-5">
                <ui:repeat value="#{LibroBean.librosEncontrados}" var="libro">
                    <div class="col">
                        <div class="card h-100 shadow-sm border-0">

                            <!-- Imagen de portada -->
                            <h:panelGroup rendered="#{not empty libro.img}">
                                <img src="#{libro.img}" class="card-img-top p-3" alt="Portada" style="height: 280px; object-fit: contain;"/>
                            </h:panelGroup>
                            <h:panelGroup rendered="#{empty libro.img}">
                                <div class="card-img-top p-3 d-flex align-items-center justify-content-center bg-secondary text-white" style="height: 280px;">
                                    <span>Sin Portada</span>
                                </div>
                            </h:panelGroup>

                            <!-- Cuerpo de la Card -->
                            <div class="card-body d-flex flex-column text-center">
                                <h6 class="card-title fw-bold text-truncate" title="#{libro.titulo}">#{libro.titulo}</h6>
                                <p class="card-text text-muted mb-4 small">
                                    <!-- Muestra solo el primer autor para no romper el diseño -->
                                    <h:outputText value="#{not empty libro.autores ? libro.autores[0] : 'Autor Desconocido'}" />
                                </p>

                                <!-- Botones de Acción -->
                                <div class="mt-auto d-grid gap-2">
                                    <!-- Botón Leer -->
                                    <a href="#{libro.linkLectura}" target="_blank"
                                       class="btn btn-outline-success #{empty libro.linkLectura ? 'disabled' : ''}">
                                        Leer Libro
                                    </a>

                                    <!-- Botón Detalles -->
                                    <h:commandButton action="#{LibroBean.verDetalle(libro)}"
                                                     value="Ver Detalles" class="btn btn-dark" />
                                </div>
                            </div>
                        </div>
                    </div>
                </ui:repeat>
            </div>
        </h:form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</h:body>
</html>
